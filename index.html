<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underfloor Heating Designer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="compact.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <i class="fas fa-fire-flame-curved"></i>
                <h1>UFH Designer</h1>
                <span class="version">v2.1.0</span>
            </div>
            <div class="header-right">
                <button id="newProject" class="btn btn-secondary">
                    <i class="fas fa-file"></i> New Project
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Mobile Bottom Toolbar (Select, Room, Zone, Window, Settings, Calculate) -->
            <div class="mobile-bottom-toolbar">
                <button class="mobile-tool-btn active" data-tool="select" title="Select">
                    <i class="fas fa-mouse-pointer"></i>
                    <span>Select</span>
                </button>
                <button class="mobile-tool-btn" data-tool="room" title="Add Room">
                    <i class="fas fa-vector-square"></i>
                    <span>Room</span>
                </button>
                <button class="mobile-tool-btn" data-tool="zone" title="Add Zone">
                    <i class="fas fa-square-dashed"></i>
                    <span>Zone</span>
                </button>
                <button class="mobile-tool-btn" id="mobileSettingsBtn" title="Settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </button>
                <button class="mobile-tool-btn mobile-calc-btn" id="mobileCalculateBtn" title="Calculate">
                    <i class="fas fa-calculator"></i>
                    <span>Calculate</span>
                </button>
            </div>

            <!-- Toolbar (Desktop only) -->
            <aside class="toolbar" id="toolbarPanel">
                <div class="tool-group">
                    <button class="tool-btn active" data-tool="select" title="Select">
                        <i class="fas fa-mouse-pointer"></i>
                        <span>Select</span>
                    </button>
                    <button class="tool-btn" data-tool="room" title="Add Room (Heated)">
                        <i class="fas fa-vector-square"></i>
                        <span>Room</span>
                    </button>
                    <button class="tool-btn" data-tool="zone" title="Add Zone (Unheated)">
                        <i class="fas fa-square-dashed"></i>
                        <span>Zone</span>
                    </button>
                </div>

                <div class="section-divider"></div>

                <div class="param-group">
                    <label>Outdoor (°C)</label>
                    <input type="number" id="outdoorTemp" value="-10" step="0.5">

                    <label>Height (m)</label>
                    <input type="number" id="roomHeight" value="2.7" step="0.1" min="2">

                    <label>Grid (m)</label>
                    <input type="number" id="gridSize" value="0.5" step="0.1" min="0.1">
                </div>

                <div class="action-group">
                    <button id="calculate" class="btn btn-primary">
                        <i class="fas fa-calculator"></i> Calculate
                    </button>
                </div>
            </aside>

            <!-- Canvas Area -->
            <main class="canvas-area">
                <canvas id="drawingCanvas"></canvas>
                
                <!-- Contextual Toolbar (appears near selected elements) -->
                <div id="contextualToolbar" class="contextual-toolbar"></div>
                
                <div class="canvas-info">
                    <span id="cursorPos">X: 0.0m, Y: 0.0m</span>
                    <span id="canvasStatus">Click to place wall start point</span>
                </div>
            </main>

            <!-- Right Properties Panel / Settings -->
            <aside class="properties-panel" id="settingsPanel">
                <div class="toolbar-header">
                    <h3>Settings</h3>
                    <button class="close-btn" id="closeProperties">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <!-- General Settings -->
                <div class="config-section">
                    <h3>General</h3>
                    <label>Indoor Temp (°C)</label>
                    <input type="number" id="indoorTemp" value="20" step="0.5">
                    
                    <label>Outdoor Temp (°C)</label>
                    <input type="number" id="outdoorTemp2" value="-10" step="0.5">
                    
                    <label>Room Height (m)</label>
                    <input type="number" id="roomHeight2" value="2.7" step="0.1" min="2">
                    
                    <label>Grid Size (m)</label>
                    <input type="number" id="gridSize2" value="0.5" step="0.1" min="0.1">
                </div>
                
                <div id="propertiesContent">
                    <div class="properties-empty">
                        <i class="fas fa-hand-pointer"></i>
                        <p>Select an element</p>
                    </div>
                </div>

                <!-- Floor Configuration -->
                <div class="config-section">
                    <h3>Floor</h3>
                    <label>Material</label>
                    <select id="floorMaterial">
                        <option value="concrete">Concrete</option>
                        <option value="tile">Tile</option>
                        <option value="wood">Wood</option>
                        <option value="carpet">Carpet</option>
                    </select>

                    <label>Below</label>
                    <select id="floorBelow">
                        <option value="ground">Ground</option>
                        <option value="heated">Heated</option>
                        <option value="unheated">Unheated</option>
                    </select>

                    <div class="section-divider"></div>
                    
                    <label>UFH System</label>
                    <select id="installationType">
                        <option value="wet">Wet (Screed)</option>
                        <option value="overlay-aluminum">Overlay - Aluminum</option>
                        <option value="overlay-grooved">Overlay - Grooved</option>
                        <option value="overlay-basic">Overlay - Basic</option>
                    </select>
                    
                    <div id="overlayOptions" style="display: none;">
                        <label>Insulation (mm)</label>
                        <select id="insulationBelow">
                            <option value="0">None</option>
                            <option value="10">10mm</option>
                            <option value="20" selected>20mm</option>
                            <option value="30">30mm</option>
                            <option value="50">50mm</option>
                        </select>
                    </div>

                    <label>Pipe Spacing</label>
                    <select id="pipeSpacing">
                        <option value="100">100mm</option>
                        <option value="150" selected>150mm</option>
                        <option value="200">200mm</option>
                        <option value="300">300mm</option>
                    </select>

                    <label>Supply Temp (°C)</label>
                    <input type="number" id="supplyTemp" value="40" step="1" min="30" max="55">

                    <label>Return Temp (°C)</label>
                    <input type="number" id="returnTemp" value="35" step="1" min="25" max="50">
                </div>

                <div class="config-section">
                    <h3>Ceiling</h3>
                    <label>Material</label>
                    <select id="ceilingMaterial">
                        <option value="concrete">Concrete</option>
                        <option value="plaster">Plaster</option>
                        <option value="wood">Wood</option>
                    </select>

                    <label>Above</label>
                    <select id="ceilingAbove">
                        <option value="heated">Heated</option>
                        <option value="unheated">Unheated</option>
                        <option value="outdoor">Outdoor</option>
                    </select>
                </div>
            </aside>
            
            <!-- Results Section (independent modal) -->
            <div id="resultsSection" class="results-section" style="display: none;">
                <div class="toolbar-header">
                    <h3>Results</h3>
                    <button class="close-btn" id="closeResults">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="result-summary">
                    <div class="result-item">
                        <i class="fas fa-bolt"></i>
                        <div>
                            <label>Total Heat Loss</label>
                            <strong id="totalLoss">-</strong>
                        </div>
                    </div>
                    <div class="result-item">
                        <i class="fas fa-fire"></i>
                        <div>
                            <label>UFH Required</label>
                            <strong id="ufhRequired">-</strong>
                        </div>
                    </div>
                    <div class="result-item">
                        <i class="fas fa-thermometer-half"></i>
                        <div>
                            <label>Floor Temp</label>
                            <strong id="floorTemp">-</strong>
                        </div>
                    </div>
                </div>

                <div id="validationStatus" class="validation-status"></div>

                <h4>Breakdown</h4>
                <div id="breakdownDetails" class="breakdown-details"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
